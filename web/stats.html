<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistika — OPTCG Tracker</title>
    <link rel="stylesheet" href="demo.css">
  </head>
  <body>
    <header>
      <a class="brand" href="index.html"><span class="brand-mark">☠</span><span>OPTCG <span>TRACKER</span></span></a>
      <nav><span id="user-label"></span><a href="index.html">Leaderi</a><a href="tournaments.html">Turniri</a><a href="matches.html">Mečevi</a><a href="stats.html">Statistika</a><button type="button" data-logout>Odjava</button></nav>
    </header>
    <main>
      <div class="eyebrow">Rezultati i učinak</div>
      <h1>Moja statistika</h1>
      <p class="intro">Pregled rezultata iz tvojih zabilježenih mečeva.</p>
      <p id="notice" class="notice" role="status"></p>
      <section id="summary" class="stats-summary" aria-live="polite"></section>
      <div class="stats-sections">
        <section class="panel">
          <h2>Po mom Leaderu</h2>
          <div id="by-my-leader"></div>
        </section>
        <section class="panel">
          <h2>Po protivniku</h2>
          <div id="by-opponent"></div>
        </section>
        <section class="panel">
          <h2>Po protivnikovom Leaderu</h2>
          <div id="by-opponent-leader"></div>
        </section>
        <section class="panel">
          <h2>Protivnik + Leader</h2>
          <div id="by-matchup"></div>
        </section>
      </div>
    </main>
    <footer>OPTCG Tracker · Demo sučelje</footer>
    <script src="demo.js"></script>
  </body>
</html>
