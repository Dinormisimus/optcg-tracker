<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OPTCG Tracker — Leaders</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101114;
        color: #f5f5f5;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(ellipse at 85% 0%, #49220f66, transparent 34rem),
          #101114;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 22px max(6vw, 24px);
        border-bottom: 1px solid #ffffff16;
      }

      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .04em; }
      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: #f26b38;
        color: #151515;
        font-size: 20px;
      }
      .brand span:last-child { color: #a7a7ac; font-size: 12px; font-weight: 600; letter-spacing: .16em; }
      .demo-tag { color: #c8c8cc; font-size: 13px; }
      nav { display: flex; align-items: center; gap: 18px; color: #b7b7bd; font-size: 14px; }
      nav a:hover { color: #f27b4c; }

      main { width: min(1120px, 88vw); margin: 64px auto 80px; }
      .eyebrow { color: #f27b4c; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 12px 0 10px; font-size: clamp(38px, 7vw, 68px); letter-spacing: -.055em; line-height: 1; }
      .intro { max-width: 560px; margin: 0; color: #a5a5ac; line-height: 1.65; }

      .toolbar { display: flex; gap: 12px; margin: 34px 0 20px; }
      input, select {
        min-height: 46px;
        border: 1px solid #ffffff20;
        border-radius: 10px;
        outline: none;
        background: #1b1c20;
        color: #f5f5f5;
        font: inherit;
      }
      input { flex: 1; padding: 0 15px; }
      select { min-width: 150px; padding: 0 12px; }
      input:focus, select:focus { border-color: #f27b4c; }
      .result-count { margin: 0 0 16px; color: #929299; font-size: 13px; }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
      .card {
        position: relative;
        display: flex;
        min-height: 232px;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 18px;
        border: 1px solid #ffffff1b;
        border-radius: 14px;
        background: linear-gradient(145deg, #24252a, #17181b 68%);
        transition: transform .18s ease, border-color .18s ease;
      }
      .card:hover { transform: translateY(-4px); border-color: #f27b4c99; }
      .card::after {
        position: absolute;
        top: -45px;
        right: -52px;
        width: 140px;
        height: 140px;
        border: 1px solid #ffffff12;
        border-radius: 50%;
        box-shadow: 0 0 0 18px #ffffff08, 0 0 0 38px #ffffff05;
        content: "";
      }
      .card-top, .card-bottom { position: relative; z-index: 1; }
      .card-top { display: flex; justify-content: space-between; align-items: center; }
      .leader-label { color: #a5a5ac; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
      .code { color: #f27b4c; font-size: 12px; font-weight: 800; }
      .card h2 { max-width: 200px; margin: 42px 0 20px; font-size: 23px; letter-spacing: -.035em; line-height: 1.15; }
      .colors { display: flex; flex-wrap: wrap; gap: 7px; }
      .color {
        padding: 5px 9px;
        border: 1px solid #ffffff20;
        border-radius: 99px;
        background: #ffffff0b;
        color: #e4e4e7;
        font-size: 11px;
      }
      .message { grid-column: 1 / -1; padding: 28px; border: 1px solid #ffffff20; border-radius: 12px; color: #c6c6ca; }
      footer { padding: 20px; border-top: 1px solid #ffffff16; color: #77777e; text-align: center; font-size: 12px; }

      @media (max-width: 560px) {
        header { padding: 18px 6vw; }
        .demo-tag { display: none; }
        nav { gap: 12px; font-size: 12px; }
        main { margin-top: 46px; }
        .toolbar { flex-direction: column; }
        select { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="brand-mark">☠</span><span>OPTCG <span>TRACKER</span></span></div>
      <nav><a href="index.html">Leaderi</a><a href="tournaments.html">Turniri</a><a href="matches.html">Mečevi</a><a href="login.html">Prijava</a></nav>
    </header>
    <main>
      <div class="eyebrow">One Piece Card Game</div>
      <h1>Leaderi</h1>
      <p class="intro">Pregledaj kolekciju Leader karata. Pretraži po imenu ili šifri i filtriraj po boji.</p>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Pretraži ime ili šifru..." aria-label="Pretraži karte">
        <select id="color-filter" aria-label="Filtriraj po boji">
          <option value="">Sve boje</option>
        </select>
      </div>
      <p id="result-count" class="result-count">Učitavanje karata...</p>
      <section id="leaders" class="grid" aria-live="polite"></section>
    </main>
    <footer>OPTCG Tracker · Demo sučelje</footer>
    <script>
      const grid = document.querySelector("#leaders");
      const search = document.querySelector("#search");
      const colorFilter = document.querySelector("#color-filter");
      const resultCount = document.querySelector("#result-count");
      let leaders = [];

      function renderLeaders() {
        const query = search.value.trim().toLowerCase();
        const selectedColor = colorFilter.value;
        const filtered = leaders.filter((leader) => {
          const matchesQuery = `${leader.name} ${leader.code}`.toLowerCase().includes(query);
          const colors = leader.color.split("/").map((color) => color.trim());
          return matchesQuery && (!selectedColor || colors.includes(selectedColor));
        });

        resultCount.textContent = `${filtered.length} ${filtered.length === 1 ? "karta" : "karata"}`;
        grid.replaceChildren();

        if (filtered.length === 0) {
          const empty = document.createElement("div");
          empty.className = "message";
          empty.textContent = "Nema karata koje odgovaraju pretrazi.";
          grid.append(empty);
          return;
        }

        for (const leader of filtered) {
          const card = document.createElement("article");
          card.className = "card";

          const top = document.createElement("div");
          top.className = "card-top";
          const label = document.createElement("span");
          label.className = "leader-label";
          label.textContent = "LEADER";
          const code = document.createElement("span");
          code.className = "code";
          code.textContent = leader.code;
          top.append(label, code);

          const name = document.createElement("h2");
          name.textContent = leader.name;
          const colors = document.createElement("div");
          colors.className = "colors";
          for (const color of leader.color.split("/")) {
            const chip = document.createElement("span");
            chip.className = "color";
            chip.textContent = color.trim();
            colors.append(chip);
          }

          const bottom = document.createElement("div");
          bottom.className = "card-bottom";
          bottom.append(colors);
          card.append(top, name, bottom);
          grid.append(card);
        }
      }

      async function loadLeaders() {
        try {
          const response = await fetch("../src/data/leaders.json");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          leaders = await response.json();

          const colors = [...new Set(leaders.flatMap((leader) => leader.color.split("/").map((color) => color.trim())))].sort();
          for (const color of colors) {
            const option = document.createElement("option");
            option.value = color;
            option.textContent = color;
            colorFilter.append(option);
          }
          renderLeaders();
        } catch (error) {
          resultCount.textContent = "Podaci nisu učitani.";
          const message = document.createElement("div");
          message.className = "message";
          message.textContent = "Pokreni lokalni web-poslužitelj iz glavne mape projekta da bi se karte učitale.";
          grid.append(message);
          console.error("Greška pri učitavanju Leader karata:", error);
        }
      }

      search.addEventListener("input", renderLeaders);
      colorFilter.addEventListener("change", renderLeaders);
      loadLeaders();
    </script>
  </body>
</html>
